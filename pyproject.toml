[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-vlm-rag"
version = "0.1.0"
description = "MinerU + Qwen3-VL complex PDF ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "lxml>=6.0",
  "numpy>=2.0",
  "openai>=2.0",
  "opencv-python-headless>=4.10",
  "Pillow>=12.0",
  "pydantic>=2.10",
  "pymilvus>=2.6",
  "PyMySQL>=1.1",
  "pypdf>=6.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.32",
  "SQLAlchemy>=2.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
mineru-vlm-rag = "mineru_vlm_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:pkg_resources is deprecated as an API.*:UserWarning:milvus_lite",
]
